<div class="verificar-wrap">
  <div class="verificar-card">
    <div class="verificar-header">
      <img src="logocompleto.png" alt="Quisqueya Flight Hub" class="brand-img">
      <p>Ingresa el código de 6 dígitos que enviamos a<br><strong>{{ email }}</strong></p>
    </div>

    <form class="formulario" (ngSubmit)="verificar()">
      <label>
        Código de verificación
        <input
          type="text"
          name="codigo"
          inputmode="numeric"
          maxlength="6"
          placeholder="______"
          class="codigo-input"
          required
          [(ngModel)]="codigo" />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      @if (aviso()) {
        <p class="aviso-ok">{{ aviso() }}</p>
      }

      <button type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Verificando...' : 'Verificar cuenta' }}
      </button>
    </form>

    <p class="pie">
      ¿No recibiste el código?
      <a href="javascript:void(0)" (click)="reenviar()">Reenviar</a>
    </p>
    <p class="pie">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </p>
  </div>
</div>
